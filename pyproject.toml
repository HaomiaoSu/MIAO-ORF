[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miao-orf"
version = "1.0.0"
description = "Mixture-aware inference of alternative-frame internal ORFs from Ribo-seq data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Haomiao Su", email = "suhaomiao@csu.edu.cn"},
]
keywords = ["Ribo-seq", "intORF", "overlapping ORF", "translation", "bioinformatics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pysam>=0.22,<0.24",
  "scipy>=1.10,<2",
]

[project.urls]
Repository = "https://github.com/HaomiaoSu/MIAO-ORF"
Documentation = "https://github.com/HaomiaoSu/MIAO-ORF/tree/main/docs"
Issues = "https://github.com/HaomiaoSu/MIAO-ORF/issues"

[project.scripts]
"miao-orf" = "miao_orf.launcher:main"
"miao-orf-offsets" = "miao_orf.ribotish_offsets:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["miao_orf*"]

[tool.setuptools.package-data]
miao_orf = ["psite-caller.py"]

[tool.setuptools.data-files]
"share/miao-orf" = ["miao_orf.py"]
